name: Deploy Jarvis site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build static site
        run: |
          mkdir -p site
          cp linkedin-jarvis-reactor.svg site/
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>J.A.R.V.I.S.</title>
            <style>
              :root { color-scheme: dark; }
              body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #03060b; font: 16px Segoe UI, sans-serif; color: #f6f8fb; }
              main { width: min(1200px, 100%); text-align: center; }
              img { display: block; width: 100%; height: auto; }
              p { color: #9fb0c2; }
            </style>
          </head>
          <body><main><img src="linkedin-jarvis-reactor.svg" alt="J.A.R.V.I.S. orange reactor"><p>English + Telugu voice commands for Windows.</p></main></body>
          </html>
          HTML
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
